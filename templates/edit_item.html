{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Item | Resource Loop</title>

    <link
        rel="stylesheet"
        href="{% static 'css/add_item.css' %}"
    >

    <link rel="stylesheet" href="{% static 'css/shared_theme.css' %}">
</head>


<body>


{% include 'includes/navbar.html' %}



<section class="add-item-section">


    <div class="form-box">


        <p class="tag">
            UPDATE RESOURCE
        </p>


        <h1>
            Edit Item
        </h1>


        <p class="subtitle">
            Update your resource information.
        </p>


        {% if error %}

            <div class="error-box">
                {{ error }}
            </div>

        {% endif %}


        <form
            method="POST"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            <div class="form-group">

                <label>
                    Item Title
                </label>

                <input
                    type="text"
                    name="title"
                    value="{{ item.title }}"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Category
                </label>

                <select
                    name="category"
                    required
                >

                    <option
                        value="books"
                        {% if item.category == "books" %}selected{% endif %}
                    >
                        Books
                    </option>

                    <option
                        value="notes"
                        {% if item.category == "notes" %}selected{% endif %}
                    >
                        Notes
                    </option>

                    <option
                        value="equipment"
                        {% if item.category == "equipment" %}selected{% endif %}
                    >
                        Equipment
                    </option>

                    <option
                        value="previous_questions"
                        {% if item.category == "previous_questions" %}selected{% endif %}
                    >
                        Previous Questions
                    </option>

                    <option
                        value="course_materials"
                        {% if item.category == "course_materials" %}selected{% endif %}
                    >
                        Course Materials
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                >{{ item.description }}</textarea>

            </div>


            <div class="form-group">

                <label>
                    Author
                </label>

                <input
                    type="text"
                    name="author"
                    value="{{ item.author }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Department
                </label>

                <input
                    type="text"
                    name="department"
                    value="{{ item.department }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Course Code
                </label>

                <input
                    type="text"
                    name="course_code"
                    value="{{ item.course_code }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Item Type
                </label>

                <select name="share_type">

                    <option
                        value="share"
                        {% if item.share_type == "share" %}selected{% endif %}
                    >
                        Share
                    </option>

                    <option
                        value="rent"
                        {% if item.share_type == "rent" %}selected{% endif %}
                    >
                        Rent — Equipment Only
                    </option>

                    <option
                        value="sell"
                        {% if item.share_type == "sell" %}selected{% endif %}
                    >
                        Sell — Equipment Only
                    </option>

                </select>

                <p class="help-text">
                    Rent and Sell are available only for Equipment.
                </p>

            </div>


            <div class="form-group">

                <label>
                    Price
                </label>

                <input
                    type="number"
                    name="price"
                    step="0.01"
                    min="0"
                    value="{{ item.price|default:'' }}"
                >

            </div>


            <div class="form-group">

                <label>
                    Change Image
                </label>

                <input
                    type="file"
                    name="image"
                    accept="image/*"
                >

            </div>


            <div class="form-group">

                <label>
                    Change File
                </label>

                <input
                    type="file"
                    name="file"
                >

            </div>


            <div class="form-buttons">


                <a
                    href="{% url 'my_resources' %}"
                    class="cancel-button"
                >
                    Cancel
                </a>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Save Changes
                </button>


            </div>


        </form>


    </div>


</section>


</body>

</html>
