{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>Forgot Password</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>


<body>


<div class="Main-Container">


<div class="container">


<div class="login-section">


<h1>
Forgot?
</h1>


<p>
Enter your email to receive OTP
</p>



{% if error %}

<div class="error-message">

{{error}}

</div>

{% endif %}




<form method="POST">

{% csrf_token %}



<div class="input-box">

<span>✉</span>


<input

type="email"

name="email"

placeholder="Enter your Email"

required>


</div>



<button class="login-btn">

Send OTP

</button>




<div class="signup">


<span>
Remember password?
</span>



<a href="{% url 'login' %}" class="signup-btn">

Back Login

</a>


</div>




</form>



</div>





<div class="image-section">


<div class="overlay"></div>



<div class="content">


<h1>

WELCOME TO

<br>

<span>
Student
</span>

<br>

Portal


</h1>



<p>
Password Recovery System
</p>



<div class="uap">

UNIVERSITY OF ASIA PACIFIC

<br>

<small>
LEARN • GROW • BELONG
</small>


</div>


</div>


</div>




</div>

</div>



</body>

</html>
