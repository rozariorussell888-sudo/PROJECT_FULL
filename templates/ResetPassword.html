{% load static %}

<!DOCTYPE html>
<html>

<head>

<title>Reset Password</title>

<link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>


<body>


<div class="Main-Container">


<div class="container">


<div class="login-section">


<h1>
Reset
</h1>


<p>
Create your new password
</p>



<form method="POST">

{% csrf_token %}



<div class="input-box">

<span>
🔒
</span>


<input

type="password"

name="password"

placeholder="New Password"

required>


</div>




<button class="login-btn">

Change Password

</button>



<div class="signup">


<span>
Already changed?
</span>


<a href="{% url 'login' %}" class="signup-btn">

Login

</a>


</div>



</form>



</div>





<div class="image-section">


<div class="overlay"></div>



<div class="content">


<h1>

WELCOME TO

<br>

<span>
Student
</span>

<br>

Portal


</h1>


<p>
Secure Account Recovery

</p>


<div class="uap">

UNIVERSITY OF ASIA PACIFIC

<br>

<small>
LEARN • GROW • BELONG
</small>


</div>


</div>


</div>



</div>


</div>


</body>

</html>
